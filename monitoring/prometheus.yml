global:
  scrape_interval: 10s

scrape_configs:

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'greenhouse-core-sim'
    static_configs:
      - targets: ['greenhouse-core-sim:3001']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']