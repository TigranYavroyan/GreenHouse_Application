version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: greenhouse-redis
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - greenhouse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: greenhouse-rabbitmq
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - greenhouse-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  greenhouse-core-sim:
    build:
      context: ./sim
      dockerfile: Dockerfile
    container_name: greenhouse-core-sim
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./sim/logs:/app/logs
    networks:
      - greenhouse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/metadata/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenhouse-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - GREENHOUSE_CORE_URL=http://greenhouse-core-sim:3001
      - GREENHOUSE_CORE_TIMEOUT=10000
      - GREENHOUSE_CORE_RETRIES=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      greenhouse-core-sim:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - greenhouse-network
      - postgres-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/metadata/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenhouse-frontend
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY}
      - ENVIRONMENT=production
    env_file:
      - ./frontend/.env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:${XAUTHORITY}
      - ./frontend:/app
    networks:
      - greenhouse-network
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    networks:
      - postgres-network 
    env_file:
      - ./backend/.env.development
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: greenhouse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - greenhouse-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: greenhouse-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - greenhouse-network
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: greenhouse-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    networks:
      - greenhouse-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: greenhouse-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - greenhouse-network

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: greenhouse-rabbitmq-exporter
    environment:
      - RABBITMQ_URL=http://guest:guest@rabbitmq:15672/
    ports:
      - "9419:9419"
    networks:
      - greenhouse-network

volumes:
  redis_data:
  rabbitmq_data:
  pg_data:
  prometheus_data:
  grafana_data:

networks:
  greenhouse-network:
    driver: bridge
  postgres-network:
    driver: bridge